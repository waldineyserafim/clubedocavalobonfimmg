<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso Master — Serafim Technologies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="icon" type="image/png" href="assets/img/logo_CCBMG.png">
  <style>
    :root { --brand: #111279; }
    body { background: #0d0f2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 40px rgba(0,0,0,.35);
    }
    .logo-area { text-align: center; margin-bottom: 1.75rem; }
    .logo-area .platform-name { font-size: 1.1rem; font-weight: 700; color: var(--brand); letter-spacing: .02em; }
    .logo-area .platform-sub { font-size: .78rem; color: #888; }
    .btn-master {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      font-weight: 600;
    }
    .btn-master:hover { background: #0d0f55; border-color: #0d0f55; color: #fff; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-area">
      <div class="platform-name">Serafim Technologies</div>
      <div class="platform-sub">Painel Administrativo Global</div>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label small fw-semibold" for="emailInput">E-mail</label>
        <input type="email" class="form-control" id="emailInput" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold" for="passInput">Senha</label>
        <input type="password" class="form-control" id="passInput" autocomplete="current-password" required>
      </div>
      <div id="errMsg" class="alert alert-danger py-2 small d-none"></div>
      <button type="submit" class="btn btn-master w-100" id="btnLogin">Entrar</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, doc, getDoc }
      from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB1HBodrFRmgGKnYtX2v0X5LiIkowhR9wg",
      authDomain: "clubecavalobonfim.firebaseapp.com",
      projectId: "clubecavalobonfim",
      storageBucket: "clubecavalobonfim.firebasestorage.app",
      messagingSenderId: "115015503370",
      appId: "1:115015503370:web:3864e3e55714d33f8319f3"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const errMsg  = document.getElementById("errMsg");
    const btnLogin = document.getElementById("btnLogin");

    function showErr(msg) {
      errMsg.textContent = msg;
      errMsg.classList.remove("d-none");
    }

    async function checkAndRedirect(user) {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (!snap.exists()) { showErr("Usuário não encontrado no sistema."); await auth.signOut(); return; }
      const role = (snap.data().role || "").toLowerCase().trim();
      if (role !== "master") {
        showErr("Acesso negado. Apenas usuários master podem acessar este painel.");
        await auth.signOut();
        return;
      }
      window.location.href = "admin_master.html";
    }

    // If already logged in as master, redirect immediately
    onAuthStateChanged(auth, async user => {
      if (user) {
        btnLogin.disabled = true;
        btnLogin.textContent = "Verificando…";
        await checkAndRedirect(user);
      }
    });

    document.getElementById("loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      errMsg.classList.add("d-none");
      const email = document.getElementById("emailInput").value.trim();
      const pass  = document.getElementById("passInput").value;
      if (!email || !pass) { showErr("Preencha e-mail e senha."); return; }

      btnLogin.disabled = true;
      btnLogin.textContent = "Entrando…";

      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        await checkAndRedirect(cred.user);
      } catch (err) {
        const msgs = {
          "auth/invalid-email":           "E-mail inválido.",
          "auth/user-not-found":          "Usuário não encontrado.",
          "auth/wrong-password":          "Senha incorreta.",
          "auth/invalid-credential":      "E-mail ou senha incorretos.",
          "auth/too-many-requests":       "Muitas tentativas. Aguarde e tente novamente.",
          "auth/user-disabled":           "Conta desativada.",
        };
        showErr(msgs[err.code] || "Erro ao entrar: " + err.message);
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
