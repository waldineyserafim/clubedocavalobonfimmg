<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurações Globais — Painel Master</title>
  <link rel="icon" type="image/png" href="assets/img/logo_CCBMG.png">
  <link rel="shortcut icon" href="assets/img/logo_CCBMG.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/design-system.css?v=ccbmg-2026-01">
  <style>
    body { background: #f4f6fb; }
    .sidebar {
      width: 220px; min-height: 100vh; background: var(--brand); color: #fff;
      position: fixed; top: 0; left: 0; display: flex; flex-direction: column; padding: 1.5rem 0;
    }
    .sidebar .brand { padding: .5rem 1.25rem 1.5rem; font-weight: 700; font-size: 1.05rem; border-bottom: 1px solid rgba(255,255,255,.15); }
    .sidebar .nav-link { color: rgba(255,255,255,.8); padding: .55rem 1.25rem; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.1); }
    .sidebar .nav-link.text-danger { color: #ff7b7b!important; }
    .main { margin-left: 220px; padding: 2rem; }
    @media (max-width: 767px) { .sidebar { display: none; } .main { margin-left: 0; padding: 1rem; } }
  </style>
</head>
<body>

<nav class="sidebar">
  <div class="brand"><i class="bi bi-lightning-charge-fill me-1"></i> Painel Master</div>
  <ul class="nav flex-column mt-2">
    <li class="nav-item"><a class="nav-link" href="admin_master.html">Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" href="admin_master_associacoes.html">Associações</a></li>
    <li class="nav-item"><a class="nav-link" href="admin_master_faturamento.html">Faturamento</a></li>
    <li class="nav-item"><a class="nav-link active" href="admin_master_configuracoes.html">Configurações</a></li>
    <li class="nav-item mt-auto"><a class="nav-link text-danger" id="btnSair" href="#">Sair</a></li>
  </ul>
</nav>

<main class="main">
  <h1 class="h4 mb-4">Configurações Globais da Plataforma</h1>

  <div id="loadingMsg" class="text-muted text-center py-4">Carregando configurações...</div>
  <div id="formArea" class="d-none">

    <div class="card border-0 shadow-sm mb-4">
      <div class="card-header bg-white"><strong>Identidade da Plataforma</strong></div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nome da Plataforma</label>
            <input class="form-control" id="cfgNome" placeholder="SaaS CCBMG">
          </div>
          <div class="col-md-6">
            <label class="form-label">URL Base</label>
            <input class="form-control" id="cfgUrl" placeholder="https://clubedocavalobonfim.com.br">
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-4">
      <div class="card-header bg-white"><strong>E-mails de Notificação</strong></div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">E-mail Principal</label>
            <input class="form-control" id="cfgEmail1" type="email" placeholder="waldiney.serafim@gmail.com">
          </div>
          <div class="col-md-6">
            <label class="form-label">E-mail Secundário</label>
            <input class="form-control" id="cfgEmail2" type="email" placeholder="mpmarquesnutri@gmail.com">
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-4">
      <div class="card-header bg-white"><strong>Integrações Globais</strong></div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Firebase Project ID</label>
            <input class="form-control" id="cfgFirebaseProject" placeholder="clubecavalobonfim" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label">Region (Cloud Functions)</label>
            <input class="form-control" id="cfgRegion" placeholder="us-central1" readonly>
          </div>
          <div class="col-12">
            <label class="form-label">Webhook Asaas (Principal)</label>
            <input class="form-control" id="cfgWebhook" readonly value="https://us-central1-clubecavalobonfim.cloudfunctions.net/asaasWebhook">
          </div>
          <div class="col-12">
            <label class="form-label">Webhook Asaas (Leilões)</label>
            <input class="form-control" id="cfgWebhookLeiloes" readonly value="https://us-central1-clubecavalobonfim.cloudfunctions.net/auctionAsaasWebhook">
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-4">
      <div class="card-header bg-white"><strong>Ações Globais</strong></div>
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-outline-primary btn-sm" id="btnSeedData">Executar Seed de Dados</button>
          <button class="btn btn-outline-warning btn-sm" id="btnMigrar">Executar Migração orgId</button>
          <button class="btn btn-outline-secondary btn-sm" id="btnLimparCache">Limpar Cache de Módulos</button>
        </div>
        <div id="actionMsg" class="mt-3 d-none alert alert-info small"></div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button class="btn btn-secondary" id="btnCancelar">Cancelar</button>
      <button class="btn btn-primary" id="btnSalvar">Salvar Configurações</button>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script type="module">
import { auth, db } from "./firebase.js";
import { requireAuth, logAction } from "./firebase.js";
import { signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import { getApp }       from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-functions.js";

requireAuth({ requiredRole: "master", loginUrl: "./login_master.html" });

const functions = getFunctions(getApp(), "us-central1");

document.getElementById("btnSair").addEventListener("click", async e => {
  e.preventDefault();
  await signOut(auth);
  location.href = "login_master.html";
});

function showActionMsg(msg, type = "info") {
  const el = document.getElementById("actionMsg");
  el.className = `mt-3 alert alert-${type} small`;
  el.textContent = msg;
  el.classList.remove("d-none");
  setTimeout(() => el.classList.add("d-none"), 5000);
}

// Seed de Dados
document.getElementById("btnSeedData").addEventListener("click", async () => {
  if (!confirm("Executar seed de dados multi-tenant? Esta operação é idempotente.")) return;
  try {
    document.getElementById("btnSeedData").disabled = true;
    const fn = httpsCallable(functions, "seedMultiTenantData");
    const result = await fn();
    showActionMsg(result.data.message || "Seed concluído.", "success");
    await logAction("seed_multitenant_executado", {});
  } catch (e) {
    showActionMsg("Erro: " + e.message, "danger");
  } finally {
    document.getElementById("btnSeedData").disabled = false;
  }
});

// Migração orgId
document.getElementById("btnMigrar").addEventListener("click", async () => {
  if (!confirm("Executar migração de orgId? Todos os documentos existentes receberão orgId: 'org_bonfim'. Documentos que já têm orgId serão ignorados.")) return;
  try {
    document.getElementById("btnMigrar").disabled = true;
    showActionMsg("Migrando... aguarde (pode levar alguns minutos).", "info");
    const fn = httpsCallable(functions, "migrateToMultiTenant");
    const result = await fn();
    const d = result.data;
    showActionMsg(`Migração concluída: ${d.updated} atualizados, ${d.skipped} ignorados.`, "success");
    await logAction("migracao_multitenant_executada", d);
  } catch (e) {
    showActionMsg("Erro: " + e.message, "danger");
  } finally {
    document.getElementById("btnMigrar").disabled = false;
  }
});

// Limpar cache de módulos
document.getElementById("btnLimparCache").addEventListener("click", () => {
  Object.keys(sessionStorage).filter(k => k.startsWith("modules_")).forEach(k => sessionStorage.removeItem(k));
  showActionMsg("Cache de módulos limpo do sessionStorage.", "success");
});

// Cancelar
document.getElementById("btnCancelar").addEventListener("click", () => location.href = "admin_master.html");

// Salvar configurações
document.getElementById("btnSalvar").addEventListener("click", async () => {
  const payload = {
    nomePlataforma: document.getElementById("cfgNome").value.trim(),
    urlBase:        document.getElementById("cfgUrl").value.trim(),
    emailPrincipal: document.getElementById("cfgEmail1").value.trim(),
    emailSecundario: document.getElementById("cfgEmail2").value.trim(),
    updatedAt:      serverTimestamp(),
  };
  try {
    await setDoc(doc(db, "systemConfig", "global"), payload, { merge: true });
    await logAction("config_global_atualizada", {});
    showActionMsg("Configurações salvas.", "success");
  } catch (e) {
    showActionMsg("Erro ao salvar: " + e.message, "danger");
  }
});

// Carregar configurações
onAuthStateChanged(auth, async user => {
  if (!user) return;
  try {
    const snap = await getDoc(doc(db, "systemConfig", "global"));
    const cfg = snap.data() || {};
    document.getElementById("cfgNome").value   = cfg.nomePlataforma || "SaaS CCBMG";
    document.getElementById("cfgUrl").value    = cfg.urlBase || "";
    document.getElementById("cfgEmail1").value = cfg.emailPrincipal || "waldiney.serafim@gmail.com";
    document.getElementById("cfgEmail2").value = cfg.emailSecundario || "mpmarquesnutri@gmail.com";
    document.getElementById("cfgFirebaseProject").value = "clubecavalobonfim";
    document.getElementById("cfgRegion").value = "us-central1";
  } catch (_) {}
  document.getElementById("loadingMsg").classList.add("d-none");
  document.getElementById("formArea").classList.remove("d-none");
});
</script>
</body>
</html>
