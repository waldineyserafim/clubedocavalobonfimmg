// ── SEED ────────────────────────────────────────────────────────────────────

async function seed() {
  const btn = document.getElementById("btnSeed");
  btn.disabled = true;
  btn.textContent = "⏳ Executando…";
  document.getElementById("log").innerHTML = "";

  try {
    log("=== SEED CMS CCBMG ===\n");
    const ORG = currentOrgId;
    const ts  = { orgId: ORG, deleted: false, createdAt: serverTimestamp(), updatedAt: serverTimestamp() };

    // BANNERS
    log("── Banners ──");
    for (const b of BANNERS) {
      await addDoc(collection(db,"cms_banners"), { ...b, ...ts });
      log(`  ✅ Banner ${b.ordem}: ${b.imagemUrl.split("/").pop()}`);
    }

    // EVENTS
    log("\n── Eventos ──");
    for (const e of EVENTS) {
      const payload = { ...e, ...ts };
      payload.data = e.data; // native Date → Firestore converts automatically
      await addDoc(collection(db,"cms_events"), payload);
      log(`  ✅ ${e.titulo}`);
    }

    // PARTNERS
    log("\n── Parceiros ──");
    for (const p of PARTNERS) {
      await addDoc(collection(db,"cms_partners"), { ...p, ...ts });
      log(`  ✅ ${p.nome}`);
    }

    // BOARD
    log("\n── Diretoria ──");
    for (const m of BOARD) {
      await addDoc(collection(db,"cms_board"), { ...m, ...ts });
      log(`  ✅ [${m.categoria}] ${m.nome} — ${m.cargo}`);
    }

    // GALLERY
    log("\n── Galeria ──");
    const albumRef = await addDoc(collection(db,"cms_gallery"), { ...GALLERY_ALBUM, ...ts });
    log(`  ✅ Álbum criado: "${GALLERY_ALBUM.titulo}" (id: ${albumRef.id})`);
    for (const f of GALLERY_FOTOS) {
      await addDoc(collection(db,"cms_gallery",albumRef.id,"fotos"), { ...f, updatedAt: serverTimestamp() });
      log(`     📷 ${f.legenda}`);
    }

    // ABOUT
    log("\n── Sobre o Clube ──");
    await setDoc(doc(db,"cms_about",ORG), { ...ABOUT, ...ts }, { merge:true });
    log(`  ✅ Documento cms_about/${ORG} salvo`);

    log("\n\n✅ SEED CONCLUÍDO COM SUCESSO!\nAbra admin_banners.html, admin_eventos.html, etc. para verificar.");
    btn.textContent = "✅ Concluído";
    btn.className = "btn btn-success";

  } catch(err) {
    log(`\n❌ ERRO: ${err.message}`, "text-danger");
    console.error(err);
    btn.disabled = false;
    btn.textContent = "▶ Tentar novamente";
  }
}

document.getElementById("btnSeed").addEventListener("click", seed);
