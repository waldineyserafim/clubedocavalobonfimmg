<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in Evento — Clube do Cavalo</title>
  <link rel="icon" type="image/png" href="assets/img/logo_CCBMG.png">
  <link rel="shortcut icon" href="assets/img/logo_CCBMG.png" type="image/png">
  <link href="assets/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/design-system.css?v=ccbmg-2026-01">
  <style>
    :root{--brand:#111279;--brand-dark:#0a0c55;--accent:#2a9d8f;}
    .bg-primary{background-color:var(--brand)!important;}
    .btn-primary{background-color:var(--brand)!important;border-color:var(--brand)!important;}
    .brand-logo{height:36px;width:auto;object-fit:contain;filter:brightness(0) invert(1);}
    html,body{height:100%;} body{min-height:100dvh;display:flex;flex-direction:column;} main{flex:1 0 auto;}
    .result-icon{font-size:4rem;display:block;text-align:center;margin-bottom:.75rem;}
    .result-box{border-radius:16px;padding:2rem 1.5rem;text-align:center;max-width:400px;margin:0 auto;}
    .result-confirmed{background:#d1e7dd;border:2px solid #0f5132;}
    .result-already{background:#fff3cd;border:2px solid #664d03;}
    .result-invalid{background:#f8d7da;border:2px solid #842029;}
    .result-canceled{background:#e2e3e5;border:2px solid #6c757d;}
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary shadow-sm">
  <div class="container d-flex align-items-center gap-2 flex-nowrap">
    <a class="navbar-brand d-flex align-items-center fw-bold text-truncate" href="admin.html">
      <img class="brand-logo me-2" src="assets/img/logo_CCBMG.png" alt="Logo">
      <span style="font-size:.9rem;">Clube do Cavalo</span>
    </a>
    <a class="btn btn-sm btn-outline-light ms-auto" href="admin_inscricoes.html">
      <i class="bi bi-list-ul me-1"></i>Inscrições
    </a>
  </div>
</nav>

<main class="container py-4">
  <div id="stateLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-secondary small">Validando check-in…</p>
  </div>

  <div id="stateResult" class="d-none py-3">
    <div id="resultBox" class="result-box">
      <span id="resultIcon" class="result-icon"></span>
      <h5 id="resultTitle" class="fw-bold mb-1">—</h5>
      <p id="resultNome" class="mb-1" style="font-size:1.1rem;"></p>
      <p id="resultEvento" class="text-secondary small mb-2"></p>
      <p id="resultDetail" class="text-secondary small mb-0"></p>
    </div>
    <div class="text-center mt-4">
      <button id="btnProximo" class="btn btn-primary px-4">
        <i class="bi bi-qr-code-scan me-1"></i>Próximo check-in
      </button>
      <div class="mt-2">
        <a href="admin_inscricoes.html" class="text-secondary small">Ver lista de inscritos</a>
      </div>
    </div>
  </div>

  <div id="stateNoToken" class="d-none text-center py-5">
    <i class="bi bi-qr-code-scan text-secondary" style="font-size:3rem;"></i>
    <p class="mt-3 text-secondary">Escaneie o QR Code do comprovante com a câmera do seu celular para realizar o check-in.</p>
    <hr>
    <p class="small text-secondary mb-2">Ou informe o token manualmente:</p>
    <div class="d-flex gap-2 justify-content-center">
      <input type="text" id="manualToken" class="form-control form-control-sm" placeholder="Token do comprovante" style="max-width:280px;">
      <button id="btnManual" class="btn btn-primary btn-sm">Verificar</button>
    </div>
    <div id="manualMsg" class="small text-danger mt-2 d-none"></div>
  </div>
</main>

<footer class="mt-auto py-3 border-top" style="background:var(--brand-dark);">
  <div class="container text-center text-white" style="font-size:.72rem;opacity:.65;">
    Check-in — Clube do Cavalo de Bonfim MG
  </div>
</footer>

<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="./tenant.config.js"></script>
<script type="module">
  import { requireAuth } from "./firebase.js";
  import { getApp }       from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getFunctions, httpsCallable }
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-functions.js";

  requireAuth({ requiredRole: ["admin","Admin","master","Master","operador","Operador","Admin View","adminView"] });

  const functions = getFunctions(getApp(), "us-central1");
  const params    = new URLSearchParams(location.search);
  const token     = params.get("token");

  function showState(id) {
    ["stateLoading","stateResult","stateNoToken"].forEach(s => document.getElementById(s).classList.add("d-none"));
    document.getElementById(id).classList.remove("d-none");
  }

  async function doCheckin(tok) {
    showState("stateLoading");
    try {
      const fn = httpsCallable(functions, "confirmEventCheckin");
      const res = await fn({ token: tok });
      renderResult(res.data);
    } catch(err) {
      renderResult({ result: "invalid" });
    }
  }

  function renderResult(data) {
    showState("stateResult");
    const box    = document.getElementById("resultBox");
    const icon   = document.getElementById("resultIcon");
    const title  = document.getElementById("resultTitle");
    const nome   = document.getElementById("resultNome");
    const evento = document.getElementById("resultEvento");
    const detail = document.getElementById("resultDetail");

    box.className    = "result-box";
    nome.textContent  = data.nome || "";
    evento.textContent = data.eventoTitulo || "";
    detail.textContent = "";

    switch (data.result) {
      case "confirmed":
        box.classList.add("result-confirmed");
        icon.textContent  = "✅";
        title.textContent = "Presença confirmada!";
        break;
      case "already_confirmed":
        box.classList.add("result-already");
        icon.textContent  = "⚠️";
        title.textContent = "Já confirmado";
        detail.textContent = `Confirmado em ${data.confirmedAt || "—"}`;
        break;
      case "canceled":
        box.classList.add("result-canceled");
        icon.textContent  = "🚫";
        title.textContent = "Inscrição cancelada";
        break;
      default:
        box.classList.add("result-invalid");
        icon.textContent  = "❌";
        title.textContent = "Token inválido";
        nome.textContent  = "";
        evento.textContent = "QR Code não reconhecido.";
    }
  }

  if (token) {
    doCheckin(token);
  } else {
    showState("stateNoToken");
  }

  document.getElementById("btnProximo")?.addEventListener("click", () => {
    showState("stateNoToken");
    document.getElementById("manualToken").value = "";
    document.getElementById("manualMsg").classList.add("d-none");
  });

  document.getElementById("btnManual")?.addEventListener("click", () => {
    const tok = document.getElementById("manualToken").value.trim();
    if (!tok) {
      document.getElementById("manualMsg").textContent = "Informe o token.";
      document.getElementById("manualMsg").classList.remove("d-none");
      return;
    }
    document.getElementById("manualMsg").classList.add("d-none");
    doCheckin(tok);
  });
</script>
</body>
</html>
